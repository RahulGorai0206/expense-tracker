name: Build and Upload Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v*, e.g., v1.0.0

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Needed for creating a release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Read-only: a cache saved under refs/tags/vX can never be read by
      # another tag, so writing one would just burn storage against the repo's
      # 10 GB quota. With no cache published from main, release builds start
      # cold and resolve dependencies from scratch.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        id: decode_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: 'keystore.jks'
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      # Extract the version string from the git tag: "refs/tags/v2.3.1" → "2.3.1"
      - name: Extract version from tag
        id: version
        run: |
          RAW_TAG="${GITHUB_REF#refs/tags/}"   # strip "refs/tags/" → "v2.3.1"
          VERSION="${RAW_TAG#v}"               # strip leading "v"  → "2.3.1"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (tag: $RAW_TAG)"

      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.filePath }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs with version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cd app/build/outputs/apk/release
          for file in *.apk; do
            if [ -f "$file" ]; then
              new_name=$(echo "$file" | sed -E "s/^app-(.*)-release\.apk$/app-v${VERSION}-\1.apk/")
              if [ "$new_name" = "$file" ]; then
                new_name=$(echo "$file" | sed -E "s/^app-release\.apk$/app-v${VERSION}.apk/")
              fi
              if [ "$new_name" = "$file" ]; then
                new_name=$(echo "$file" | sed "s/\.apk$/-v${VERSION}.apk/")
              fi
              mv "$file" "$new_name"
              echo "Renamed $file to $new_name"
            fi
          done

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
